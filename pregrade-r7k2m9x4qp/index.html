  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
  return new TextDecoder().decode(buf);
}
function show(html){document.open();document.write(html);document.close()}
var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
  var pw=document.getElementById('pw').value;
  try{var html=await open(pw);try{sessionStorage.setItem('slabcheck.k',pw)}catch(_){}show(html)}
  catch(x){err.textContent=(window.isSecureContext===false)?'This page needs a secure (https) connection.':'Wrong password.';go.disabled=false;go.textContent='Unlock'}
});
try{var saved=sessionStorage.getItem('slabcheck.k');if(saved){open(saved).then(show).catch(function(){sessionStorage.removeItem('slabcheck.k')})}}catch(_){}
})();
</script></body></html>
